name: build-and-test
permissions:
  contents: write
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: dotnet build src/GeminiLauncher.csproj -c Release
      - name: Single-file check (exe alone in an empty folder)
        shell: pwsh
        run: |
          $solo = Join-Path $env:RUNNER_TEMP "solo"
          New-Item -ItemType Directory -Force $solo | Out-Null
          Copy-Item "src/bin/Release/net48/GeminiLauncher.exe" $solo
          Get-ChildItem "src/bin/Release/net48" | Format-Table Name, Length
          "SOLO_EXE=$solo\GeminiLauncher.exe" | Out-File -Append $env:GITHUB_ENV
      - name: Make sure the WebView2 Runtime is installed
        shell: pwsh
        run: |
          $keys = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}',
                  'HKLM:\SOFTWARE\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}',
                  'HKCU:\Software\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $pv = $keys | ForEach-Object { (Get-ItemProperty $_ -ErrorAction SilentlyContinue).pv } | Where-Object { $_ -and $_ -ne '0.0.0.0' } | Select-Object -First 1
          if ($pv) { Write-Host "WebView2 Runtime $pv already installed" }
          else {
            Write-Host "Installing WebView2 Runtime"
            Invoke-WebRequest "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile "$env:RUNNER_TEMP\wv2setup.exe"
            Start-Process "$env:RUNNER_TEMP\wv2setup.exe" -ArgumentList "/silent /install" -Wait
          }
      - name: Launch and capture screenshots
        shell: pwsh
        run: |
          $exe = $env:SOLO_EXE
          New-Item -ItemType Directory -Force shots | Out-Null
          Add-Type -AssemblyName System.Windows.Forms,System.Drawing
          function Shot($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("shots/$name.png"); $g.Dispose(); $bmp.Dispose()
          }
          function RunShot($name, $args2, $wait = 9, $keys = $null) {
            $p = Start-Process $exe -ArgumentList $args2 -PassThru
            Start-Sleep $wait
            if ($keys) {
              $ws = New-Object -ComObject WScript.Shell
              $null = $ws.AppActivate($p.Id)
              Start-Sleep -Milliseconds 400
              [System.Windows.Forms.SendKeys]::SendWait($keys)
              Start-Sleep 8
            }
            Shot $name
            $wv = @(Get-Process msedgewebview2 -ErrorAction SilentlyContinue)
            if ($wv.Count) { "{0}: {1} WebView2 processes, {2:N0} KB" -f $name, $wv.Count, (($wv | Measure-Object WorkingSet64 -Sum).Sum/1KB) | Write-Host }
            if ($p.HasExited) { Write-Host "!! $name : process exited early with $($p.ExitCode)" }
            else { "{0}: WorkingSet={1:N0} KB" -f $name, ($p.WorkingSet64/1KB) | Write-Host }
            Stop-Process $p -Force -ErrorAction SilentlyContinue
            Start-Sleep 1
          }
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize'
          New-Item -Force $key | Out-Null
          # Reproduce "Show accent color on title bars" (caused a colored strip at the top before)
          New-Item -Force 'HKCU:\Software\Microsoft\Windows\DWM' | Out-Null
          Set-ItemProperty 'HKCU:\Software\Microsoft\Windows\DWM' ColorPrevalence 1 -Type DWord
          Set-ItemProperty 'HKCU:\Software\Microsoft\Windows\DWM' AccentColor 0xFFD77800 -Type DWord
          Set-ItemProperty $key ColorPrevalence 1 -Type DWord
          foreach ($mode in @(0, 1)) {
            Set-ItemProperty $key SystemUsesLightTheme $mode -Type DWord
            Set-ItemProperty $key AppsUseLightTheme $mode -Type DWord
            Set-ItemProperty $key EnableTransparency 1 -Type DWord
            $m = if ($mode -eq 0) { 'dark' } else { 'light' }
            RunShot "home-$m" @('--portable', '--show')
            RunShot "app-$m" @('--portable', '--query', 'notepad')
            RunShot "web-$m" @('--portable', '--query', '"weather vancouver"') 16
            RunShot "google-full-$m" @('--portable', '--query', '"hello neighbour song"') 14 '^e'
            RunShot "calc-$m" @('--portable', '--query', '"(12+8)*3"')
          }
          RunShot "settings" @('--portable')
          # PC without the WebView2 Runtime: Gemini comes first, the Google row opens the browser
          $env:GEMINILAUNCHER_NO_WEBVIEW2 = '1'
          RunShot "no-webview2-web" @('--portable', '--query', '"weather vancouver"')
          RunShot "no-webview2-google-row" @('--portable', '--query', '"weather vancouver"') 9 '{DOWN}'
          Remove-Item Env:GEMINILAUNCHER_NO_WEBVIEW2
          # Turn on "Animate controls and elements inside windows" (off by default on Windows Server)
          Add-Type -Namespace W -Name U -MemberDefinition '[DllImport("user32.dll")] public static extern bool SystemParametersInfo(uint a, uint b, IntPtr c, uint d);'
          [W.U]::SystemParametersInfo(0x1043, 0, [IntPtr]1, 3) | Out-Null
          # Animation: burst of frames while opening, then press Esc twice (clear+close) to see the slide-down
          Set-ItemProperty $key SystemUsesLightTheme 0 -Type DWord; Set-ItemProperty $key AppsUseLightTheme 0 -Type DWord
          New-Item -ItemType Directory -Force shots/anim | Out-Null
          $enc = [System.Drawing.Imaging.ImageCodecInfo]::GetImageEncoders() | Where-Object { $_.MimeType -eq 'image/jpeg' }
          $ep = New-Object System.Drawing.Imaging.EncoderParameters 1
          $ep.Param[0] = New-Object System.Drawing.Imaging.EncoderParameter ([System.Drawing.Imaging.Encoder]::Quality), 60L
          function Burst($prefix, $count) {
            $sw = [Diagnostics.Stopwatch]::StartNew()
            for ($i = 0; $i -lt $count; $i++) {
              $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
              $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
              $g = [System.Drawing.Graphics]::FromImage($bmp)
              $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
              $small = New-Object System.Drawing.Bitmap $bmp, ([int]($b.Width/2)), ([int]($b.Height/2))
              $small.Save(("shots/anim/{0}-{1:D3}-{2}ms.jpg" -f $prefix, $i, $sw.ElapsedMilliseconds), $enc, $ep)
              $small.Dispose(); $g.Dispose(); $bmp.Dispose()
            }
          }
          $p = Start-Process $exe -ArgumentList @('--portable', '--show') -PassThru
          Burst "open" 90
          Start-Sleep 2
          $ws = New-Object -ComObject WScript.Shell
          $null = $ws.AppActivate($p.Id)
          Start-Sleep -Milliseconds 300
          [System.Windows.Forms.SendKeys]::SendWait("{ESC}")
          Burst "close" 25
          Stop-Process $p -Force -ErrorAction SilentlyContinue
          $p = Start-Process $exe -ArgumentList @('--portable','--background') -PassThru
          Start-Sleep 40
          "idle-background: WorkingSet={0:N0} KB  Private={1:N0} KB" -f ($p.WorkingSet64/1KB), ($p.PrivateMemorySize64/1KB) | Write-Host
          Stop-Process $p -Force -ErrorAction SilentlyContinue
          $log = "$env:APPDATA\GeminiLauncher\error.log"
          if (Test-Path $log) { Write-Host "---- error.log ----"; Get-Content $log; Copy-Item $log shots/ }
          Get-ChildItem shots | Format-Table Name, Length
      - name: Rearrange pins and remove suggestions (UI test)
        shell: pwsh
        run: ./.github/scripts/home-edit-test.ps1 -exe $env:SOLO_EXE
      - name: Push screenshots to a branch
        if: always()
        shell: pwsh
        run: |
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          $br = "ci-shots-${{ matrix.os }}"
          git checkout --orphan $br
          git rm -rf --cached . | Out-Null
          git add -f shots
          git commit -m "screenshots ${{ github.sha }}" | Out-Null
          git push -f origin "HEAD:refs/heads/$br"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots-${{ matrix.os }}
          path: shots
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'windows-2025'
        with:
          name: GeminiLauncher-exe
          path: src/bin/Release/net48/GeminiLauncher.exe
